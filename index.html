<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ thống Xét tuyển Trung cấp 2026</title>
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1tw5cj2xn99ZqvscqAjJJhktxbb3jxKAz">
    <link rel="apple-touch-icon-precomposed" href="https://lh3.googleusercontent.com/d/1tw5cj2xn99ZqvscqAjJJhktxbb3jxKAz">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #f9fafb; color: #374151; }
        .loader { width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top: 3px solid #1d4ed8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Đang xác thực phiên làm việc an toàn...</p>

    <script>
        let urlParams = new URLSearchParams(window.location.search);
        let sid = urlParams.get('sid');
        
        if (!sid) {
            sid = localStorage.getItem('ts_gh_sid');
        }

        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxFungJ0uRhuQj-vNNRO4RbNjRCHavD0uwyoaIsrUQwrNLogYmsB-9Dmfav1UWog4zFFg/exec";

        if (sid) {
            localStorage.setItem('ts_gh_sid', sid);

            // ĐỔI SANG PHƯƠNG THỨC POST ĐỂ GIẤU HOÀN TOÀN BIẾN TRÊN URL
            let form = document.createElement('form');
            form.method = 'POST'; 
            form.action = GOOGLE_WEB_APP_URL;

            let inputSid = document.createElement('input');
            inputSid.type = 'hidden';
            inputSid.name = 'sid';
            inputSid.value = sid;
            form.appendChild(inputSid);

            document.body.appendChild(form);
            form.submit();
        } else {
            window.location.href = GOOGLE_WEB_APP_URL;
        }
    </script>
</body>
</html>

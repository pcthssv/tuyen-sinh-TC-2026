<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ thống Xét tuyển Trung cấp 2026</title>
    <link rel="apple-touch-icon" href="https://pcthssv.github.io/tuyen-sinh-TC-2026/icon-180.png">
    <link rel="apple-touch-icon-precomposed" href="https://pcthssv.github.io/tuyen-sinh-TC-2026/icon-180.png">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #f9fafb; color: #374151; }
        .loader { width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top: 3px solid #1d4ed8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Đang đồng bộ phiên đăng nhập...</p>

    <script>
        // 1. Trích xuất mã Session ID từ URL của trang GitHub Pages này
        let urlParams = new URLSearchParams(window.location.search);
        let sid = urlParams.get('sid');
  
        const GOOGLE_WEB_APP_URL = "https://script.google.com/a/macros/ctec.edu.vn/s/AKfycbxFungJ0uRhuQj-vNNRO4RbNjRCHavD0uwyoaIsrUQwrNLogYmsB-9Dmfav1UWog4zFFg/exec";

        if (sid) {
            // Lưu lại vào localStorage của trang GitHub phòng hờ thiết bị hỗ trợ
            localStorage.setItem('ts_gh_sid', sid);
            // Kích hoạt điều hướng trực tiếp bỏ qua khung iframe bảo mật
            window.location.href = GOOGLE_WEB_APP_URL + "?sid=" + sid;
        } else {
            // Nếu mở trực tiếp icon mà không có tham số mới, kiểm tra xem có sid cũ trong máy không
            let cachedSid = localStorage.getItem('ts_gh_sid');
            if (cachedSid) {
                window.location.href = GOOGLE_WEB_APP_URL + "?sid=" + cachedSid;
            } else {
                // Trường hợp hoàn toàn mới, chuyển về trang đăng nhập thô
                window.location.href = GOOGLE_WEB_APP_URL;
            }
        }
    </script>
</body>
</html>
